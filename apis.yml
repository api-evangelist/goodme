name: Goodme
description: 'Goodme (brand "Good me", Chinese: 古茗; legal entity Guming Holdings Limited)
  is one of China''s largest freshly-made tea-beverage franchise chains, founded in 2010
  by Wang Yun''an and headquartered in Hangzhou, Zhejiang. It sells fruit tea, milk tea,
  and coffee through a franchise model concentrated in China''s lower-tier cities, and
  had grown to roughly 9,800 outlets nationwide by late 2024. The company listed on the
  Hong Kong Stock Exchange (SEHK: 1364) in February 2025, raising about US$233 million.
  It is a consumer-sector portfolio company of HongShan and was added to the API Evangelist
  network as a company profile. As a food-and-beverage retail franchise, Goodme publishes
  no public developer API, OpenAPI, SDK, or agent-facing surface at this time.'
